
services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: miniclip-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092,INTERNAL://kafka:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    mem_limit: 1g

  spark:
    image: apache/spark:3.5.6-python3
    container_name: miniclip-spark
    user: root
    working_dir: /opt/spark/work-dir
    command: ["tail", "-f", "/dev/null"]
    environment:
      SPARK_LOCAL_IP: 127.0.0.1
      SPARK_DRIVER_MEMORY: 1g
    volumes:
      - ./spark:/opt/spark/work-dir
      - ./sample_output:/opt/spark/sample_output
      - ./sql:/opt/spark/sql
      - ./schemas:/opt/spark/work-dir/schemas
      - ./data_quality:/opt/spark/work-dir/data_quality
    mem_limit: 2g
